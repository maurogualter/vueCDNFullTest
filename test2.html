<div id="app">
{{ message }}
</BR>
{{ message2 }}
</div>

<script type="module">
  import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

  createApp({
    setup() {
      const message = ref('Hello Vue!');
	  const message2 = ref('Hello Vue! - V2');
      return {
        message,
		message2,
      }
    }
  }).mount('#app')
</script>

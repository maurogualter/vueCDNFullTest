<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDN Vue develop config</title>
    <!-- Vue@3.5.13 {@link https://cn.vuejs.org/} -->
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
    <!-- Vue 文件转换库 {@link https://github.com/FranckFreiburger/vue3-sfc-loader} -->
    <script src="https://unpkg.com/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.js"></script>
    <!-- Vue Demi {@link https://github.com/vueuse/vue-demi} -->
    <script src="https://cdn.jsdelivr.net/npm/vue-demi@0.13.11"></script>
    <!-- VueUse {@link https://vueuse.org/} -->
    <script src="https://unpkg.com/@vueuse/shared@11.3.0/index.iife.min.js"></script>
    <script src="https://unpkg.com/@vueuse/core@11.3.0/index.iife.min.js"></script>
    <!-- Pinia {@link https://pinia.vuejs.org/zh/} {@link 参考 https://github.com/vuejs/pinia/discussions/1051}  -->
    <script src="https://cdn.jsdelivr.net/npm/pinia@2.0.36/dist/pinia.iife.min.js"></script>

    <!-- UnoCSS Reset -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css"
    />
    <!-- User defined 请确保加载于 UnoCSS 之前-->

    <!-- UnoCSS Attributify {@link 文档 https://uno.antfu.me} {@link https://github.com/unocss/unocss/tree/main/packages/runtime} -->
    <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.51.13/attributify.global.min.js"></script>

    <!-- IconifyIcon {@link https://github.com/iconify/iconify} -->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.5.1/dist/vue-router.global.min.js"></script>

    <!-- User Utils -->
    <script src="./test14/vue/utils/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader"></script>

    <script type="module" >
        const { createApp,defineAsyncComponent  } = Vue;
        const { createPinia } = Pinia;
        const { createRouter, createWebHistory }  = VueRouter;

        const { loadModule, version } = window["vue3-sfc-loader"];

        const options = {

            moduleCache: {
                vue: Vue,
            },

            getFile(url) {
                return fetch(url).then(response => response.ok ? response.text() : Promise.reject(response));
            },

            addStyle(styleStr) {
                const style = document.createElement('style');
                style.textContent = styleStr;
                const ref = document.head.getElementsByTagName('style')[0] || null;
                document.head.insertBefore(style, ref);
            },

            log(type, ...args) {
                console.log(type, ...args);
            }
        }

        const app = createApp(
            loadVueFile('./test14/vue/App.vue', {
                importmap: {
                    '~/': './test14/vue/'
                }
            })
        ).use(createPinia());

        const router = createRouter({
            history: createWebHistory(),
            routes: [
                { path: '/test14/', component: app },
                {
                    path: '/fooditems2',
                    name: 'FoodItems2',
                    component: defineAsyncComponent(() => loadModule('./test14/vue/FoodItems.vue', options)),
                },
                {
                    path: '/animalCollection2',
                    name: 'AnimalCollection2',
                    component: defineAsyncComponent(() => loadModule('./test14/vue/AnimalCollection.vue', options)),
                },
            ]
        });

        app.use(router);
        app.mount('#app');

    </script>


</head>

<body>
<div id="app">

</div>
</body>




</html>
